name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Mods need 2.1.287+; bump the pin to pick up engine type changes.
      - run: npm install -g @anthropic-ai/claude-code@2.1.288
      - run: claude plugin test .
      - run: claude plugin validate --strict .
      - run: claude plugin validate --strict .claude-plugin/marketplace.json
      # The engine writes .claude-plugin/types when a session loads the mod from a folder,
      # before the login check, so this fails with no auth but leaves the types behind.
      - run: claude -p x --plugin-dir . || true
      - run: test -f .claude-plugin/types/tsconfig.json
      - run: npx -y -p typescript tsc -p .
